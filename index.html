<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beschikbare pagina's</title>

<style>
body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
}

h1 {
    color: #333;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    border-bottom: 1px solid #e0e0e0;
}

a {
    display: block;
    padding: 0.75rem;
    text-decoration: none;
    color: #0066cc;
}

a:hover {
    background-color: #f5f5f5;
}
</style>
</head>
<body>

<h1>Beschikbare pagina's</h1>

<ul id="pages">
    <li>Pagina's laden...</li>
</ul>

<script>
// VUL DEZE WAARDEN IN
const owner = "pasajeros";
const repo = "recepten";

const apiUrl =
    `https://api.github.com/repos/${owner}/${repo}/contents`;

fetch(apiUrl)
    .then(response => response.json())
    .then(files => {

        const pages = files
            .filter(file =>
                file.type === "file" &&
                file.name.endsWith(".html") &&
                file.name.toLowerCase() !== "index.html"
            )
            .sort((a, b) => a.name.localeCompare(b.name));

        const list = document.getElementById("pages");
        list.innerHTML = "";

        if (pages.length === 0) {
            list.innerHTML =
                "<li>Geen HTML-bestanden gevonden.</li>";
            return;
        }

        pages.forEach(page => {

            const li = document.createElement("li");

            // Link naar GitHub Pages URL
            const href = page.name;

            li.innerHTML = `
                <a href="${href}">
                    📄 ${page.name.replace('.html', '')}
                </a>
            `;

            list.appendChild(li);
        });
    })
    .catch(error => {
        console.error(error);
        document.getElementById("pages").innerHTML =
            "<li>Fout bij laden van bestanden.</li>";
    });
</script>

</body>
</html>
