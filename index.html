<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index</title>

<style>
body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
}

h1 {
    margin-bottom: 1rem;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    border-bottom: 1px solid #ddd;
}

a {
    display: block;
    padding: 0.75rem 0;
    text-decoration: none;
    color: #0066cc;
}

a:hover {
    background: #f5f5f5;
}
</style>
</head>
<body>

<h1>Beschikbare pagina's</h1>

<ul id="pages">
    <li>Laden...</li>
</ul>

<script>
const owner = "pasajeros";
const repo = "recepten";

fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`)
    .then(response => response.json())
    .then(files => {

        const pages = files
            .filter(file =>
                file.type === "file" &&
                file.name.endsWith(".html") &&
                file.name !== "index.html"
            )
            .sort((a, b) => a.name.localeCompare(b.name));

        const ul = document.getElementById("pages");
        ul.innerHTML = "";

        if (pages.length === 0) {
            ul.innerHTML = "<li>Geen HTML-bestanden gevonden.</li>";
            return;
        }

        pages.forEach(page => {
            const li = document.createElement("li");

            li.innerHTML = `
                <a href="${page.name}">
                    📄 ${page.name.replace('.html', '')}
                </a>
            `;

            ul.appendChild(li);
        });
    })
    .catch(error => {
        document.getElementById("pages").innerHTML =
            "<li>Kon de directory niet lezen.</li>";
        console.error(error);
    });
</script>

</body>
</html>
